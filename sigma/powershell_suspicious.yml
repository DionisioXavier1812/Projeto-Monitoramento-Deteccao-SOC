title: Suspicious PowerShell Execution
id: dio-soc-001
description: Detecta execução suspeita de PowerShell com parâmetros incomuns.
status: experimental
author: Dionisio Xavier
date: 2026-09-09
references:
    - https://attack.mitre.org/techniques/T1059/001/
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains:
            - '-nop'
            - '-w hidden'
            - '-enc'
    condition: selection
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
falsepositives:
    - Scripts administrativos legítimos
level: high
